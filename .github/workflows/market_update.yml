name: Update Korean Market Data
on:
  schedule:a
    - cron: '45 9 * * 1-5'  # 18:45 KST
  workflow_dispatch:
concurrency:
  group: update-market-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements_auto_v5.txt
      - run: python collect_market.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: Commit refreshed data
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add market_daily.csv
          git diff --cached --quiet || (git commit -m "Update market data" && git push)
